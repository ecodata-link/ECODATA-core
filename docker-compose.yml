version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecodata
      POSTGRES_PASSWORD: ecodata_dev_local
      POSTGRES_DB: ecodata
    ports:
      - "5432:5432"
    volumes:
      - ecodata_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ecodata
      MINIO_ROOT_PASSWORD: ecodata_dev_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ecodata_minio_data:/data

  # Seul service avec un Dockerfile de production propre au depot
  ecodata:
    build:
      context: ./services/ECODATA
    env_file:
      - ./services/ECODATA/.env
    ports:
      - "3000:3000"

  # Les 4 services suivants n'ont pas de Dockerfile : ils tournent avec l'image Node
  # officielle, code source monte en volume, et leur propre script npm run dev.
  ecodata-server:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./services/ECODATA-server:/app
    env_file:
      - ./services/ECODATA-server/.env.local
    environment:
      DATABASE_URL: postgres://ecodata:ecodata_dev_local@postgres:5432/ecodata
      MINIO_ENDPOINT: minio
    ports:
      - "3003:3003"
    depends_on:
      - postgres
      - minio

  ecodata-erp:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./services/ECODATA-erp:/app
    env_file:
      - ./services/ECODATA-erp/.env.local
    environment:
      DATABASE_URL: postgres://ecodata:ecodata_dev_local@postgres:5432/ecodata
      MINIO_ENDPOINT: minio
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - minio
      - ecodata-server

  ecodata-client-gestion:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./services/ECODATA-client-gestion:/app
    env_file:
      - ./services/ECODATA-client-gestion/.env.local
    environment:
      DATABASE_URL: postgres://ecodata:ecodata_dev_local@postgres:5432/ecodata
      MINIO_ENDPOINT: minio
    ports:
      - "3005:3005"
    depends_on:
      - postgres
      - minio
      - ecodata-server

  ecodata-client-map:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./services/ECODATA-client-map:/app
    env_file:
      - ./services/ECODATA-client-map/.env.local
    environment:
      DATABASE_URL: postgres://ecodata:ecodata_dev_local@postgres:5432/ecodata
      MINIO_ENDPOINT: minio
    ports:
      - "3004:3004"
    depends_on:
      - postgres
      - minio
      - ecodata-server

volumes:
  ecodata_postgres_data:
  ecodata_minio_data:
